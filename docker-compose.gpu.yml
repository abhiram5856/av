version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nova-backend-gpu:latest
    container_name: nova-backend-gpu
    ports:
      - "8000:8000"
    environment:
      - NOVA_FORCE_CPU=false
      - DEBUG_MODE=false
      - APP_NAME=NOVA-API-Server-GPU
      - LLM_MODEL_NAME=llama3
    volumes:
      - backend-data-gpu:/app/backend/data
      - backend-reports-gpu:/app/backend/data/reports
    depends_on:
      - db
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nova-frontend:latest
    container_name: nova-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: nova-db-gpu
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nova_admin
      - POSTGRES_PASSWORD=nova_secure_pass
      - POSTGRES_DB=nova_db
    volumes:
      - postgres-data-gpu:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova_admin -d nova_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nova-redis-gpu
    ports:
      - "6379:6379"
    volumes:
      - redis-data-gpu:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend-data-gpu:
  backend-reports-gpu:
  postgres-data-gpu:
  redis-data-gpu:
