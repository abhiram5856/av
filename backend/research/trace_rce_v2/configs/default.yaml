# TRACE-RCE v2 — Default Configuration
# ======================================
# All hyperparameters are centralized here to ensure reproducibility.
# Modify this file to run ablation experiments.

model:
  d_model: 32              # Shared embedding dimension for all modalities
  n_heads: 2               # Number of attention heads in cross-attention
  n_causes: 13             # Total number of causal hypotheses in ontology
  dropout: 0.1             # Dropout rate applied after attention and MLPs
  cause_embed_dim: 32      # Dimension of learnable cause embeddings

  # Feature input dimensions (derived from AIContext fields)
  dim_visual: 4            # [confidence, coverage, peak_intensity, topk_entropy]
  dim_env: 4               # [humidity, temperature, rainfall, wetness]
  dim_severity: 4          # [base_score, env_factor, soil_factor, final_severity]
  dim_knowledge: 4         # [n_chunks, text_len_norm, rag_keyword_hit_rate, source_count]
  dim_historical: 3        # [total_diagnoses_norm, n_frequent_norm, recency_score]

training:
  lr: 1.0e-3               # Initial learning rate for AdamW
  weight_decay: 1.0e-4     # L2 regularization coefficient
  epochs: 300              # Maximum training epochs (early stopping will usually halt earlier)
  batch_size: 32           # Batch size (all 300 base samples fit easily in memory)
  patience: 30             # Early stopping patience (epochs without val NDCG improvement)
  min_delta: 1.0e-4        # Minimum improvement to reset patience counter
  lambda_cal: 0.3          # Weight of Brier calibration loss in combined loss
  grad_clip: 1.0           # Max gradient norm for clipping
  seed: 42                 # Random seed for full reproducibility
  use_amp: false           # Automatic mixed precision (set true if CUDA available)

  lr_scheduler:
    type: "cosine"         # CosineAnnealingLR — decays to eta_min over T_max epochs
    T_max: 150             # Half-period of cosine schedule
    eta_min: 1.0e-5        # Minimum learning rate at end of cosine cycle

data:
  augmentation_factor: 5   # Number of augmented variants per base scenario
  train_ratio: 0.70        # 70% of 300 base scenarios → 210 for training
  val_ratio: 0.15          # 15% → 45 for validation
  test_ratio: 0.15         # 15% → 45 for test (no augmentation applied)
  stratify_by: "disease_family"  # Ensures all disease families in every split

  augmentation:
    env_noise_std: 0.05    # Gaussian noise σ for weather features (fraction of value)
    confidence_jitter: 0.05 # ± range for vision confidence perturbation
    rag_dropout_prob: 0.2  # Probability of dropping each RAG keyword from text

evaluation:
  k_values: [1, 3]         # K values for Precision@K and Recall@K
  n_bootstrap: 10000       # Bootstrap resamples for statistical significance test
  alpha: 0.05              # Significance level for hypothesis tests
  n_calibration_bins: 10   # Number of bins for ECE computation

paths:
  checkpoint_dir: "backend/research/trace_rce_v2/checkpoints"
  results_dir: "backend/research/trace_rce_v2/experiments"
  tensorboard_dir: "backend/research/trace_rce_v2/experiments/tensorboard"
